# ----------------------------------------------------------------- 정책 현금흐름
# 규모는 작지만 tie-breaker 로는 유효합니다.
subsidy:
  seoul_birth_housing:
    enabled:
      value: false
      confidence: placeholder
      note: "서울시 자녀출산 무주택가구 주거비 지원 대상 여부. 요건 확인 후 true."
    monthly_amount:
      value: 300000
      confidence: placeholder
    max_months:
      value: 24
      confidence: placeholder
    requires_no_home:
      value: true
      confidence: unverified
      note: "무주택 요건. true 면 매수 옵션에서는 지급이 중단됩니다."

  monthly_rent_tax_credit:
    enabled:
      value: false
      confidence: placeholder
      note: "월세 세액공제. 반전세/월세 옵션의 실질 부담을 낮춥니다."
    credit_rate:
      value: 0.15
      confidence: placeholder
    annual_rent_cap:
      value: 10000000
      confidence: placeholder

# ----------------------------------------------------------------- 보증금 보호
deposit_protection:
  hug_guarantee_fee_rate:
    value: 0.00128
    confidence: placeholder
    note: "전세보증금반환보증 연 보증료율. 가입 시 비용으로 계상됩니다."
  priority_repayment_cap:
    value: 55000000
    confidence: placeholder
    note: "최우선변제 소액임차인 보증금 중 일정액. 지역별로 다릅니다."

# ----------------------------------------------------------------- 청약
cheongyak:
  special_supply_requires_no_home:
    value: true
    confidence: unverified
    note: >
      특별공급(신혼부부/생애최초/다자녀)은 무주택 요건이 있습니다.
      => 매수하는 순간 이 옵션이 소멸합니다. decision 엔진이 이를 옵션가치로 계산합니다.
  estimated_win_probability_per_year:
    value: 0.03
    confidence: placeholder
    note: >
      연간 당첨 확률 추정치. 지역/유형/가점에 따라 천차만별입니다.
      이 값은 본인 가점과 목표 단지 경쟁률로 직접 추정해서 넣으세요.
  estimated_discount_to_market:
    value: 0.15
    confidence: placeholder
    note: "분양가가 시세 대비 저렴한 정도. 당첨 시 즉시 이익의 크기."
